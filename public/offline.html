<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Tidak ada koneksi</title>
    <style>
        :root { color-scheme: dark; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #020617; color: #e2e8f0; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
        main { max-width: 360px; text-align: center; }
        h1 { font-size: 20px; margin: 0 0 8px; }
        p { margin: 0 0 20px; color: #94a3b8; font-size: 14px; line-height: 1.6; }
        button { min-height: 44px; padding: 0 20px; border: 0; border-radius: 10px; background: #059669; color: #022c22; font-weight: 700; font-size: 14px; cursor: pointer; }
        button:focus-visible { outline: 2px solid #34d399; outline-offset: 2px; }
    </style>
</head>
<body>
    <main>
        <h1>Tidak ada koneksi internet</h1>
        <p>Halaman ini butuh koneksi untuk memuat data terbaru. Periksa sinyal atau Wi-Fi Anda, lalu coba lagi. Data yang sudah tersimpan tidak hilang.</p>
        <button type="button" onclick="location.reload()">Coba Lagi</button>
    </main>
</body>
</html>
